{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card narrow"><h2>{{ APP_NAME }}</h2>
{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf }}">
<label class="fld"><span>Username</span><input name="username" value="{{ username or '' }}" autofocus autocomplete="username"></label>
<label class="fld"><span>Password</span><input type="password" name="password" autocomplete="current-password"></label>
<button class="btn">Sign in</button></form>
<p class="muted">Accounts are created by your Super Admin.</p></div>
{% endblock %}
