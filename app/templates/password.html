{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block body %}
<div class="card narrow"><h2>Change password</h2>
{% if user.must_change_password %}<p>You must set a new password before continuing.</p>{% endif %}
<form method="post" action="/account/password"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label class="fld"><span>Current password</span><input type="password" name="old" autocomplete="current-password"></label>
<label class="fld"><span>New password (6+ characters, letters and digits)</span><input type="password" name="new" autocomplete="new-password"></label>
<label class="fld"><span>Repeat new password</span><input type="password" name="new2" autocomplete="new-password"></label>
<button class="btn">Save</button></form></div>
{% endblock %}
